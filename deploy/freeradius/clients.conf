# /etc/freeradius/3.0/clients.conf
#
# One client stands for every tenant router. Routers sit behind carrier NAT and change address, so they
# cannot be listed one by one. Access is decided by the login itself: every customer login carries a
# NAS-Identifier condition that ties it to one ISP's routers.
#
# Put the value of RADIUS_SECRET from the Laravel .env in the secret line. Use a long random value:
#   openssl rand -base64 24

client trinetpay_routers {
	ipaddr = 0.0.0.0/0
	secret = CHANGE_ME
	shortname = trinetpay
	nas_type = other
}

# Lets radtest and radclient work from the server itself.
client localhost {
	ipaddr = 127.0.0.1
	secret = CHANGE_ME
	shortname = localhost
}
