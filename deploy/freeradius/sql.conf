# /etc/freeradius/3.0/mods-available/sql
#
# Minimal SQL module for TrinetPay, based on the stock FreeRADIUS 3.x file.
# Compare it with the stock file of the version you installed before using it:
#   diff /etc/freeradius/3.0/mods-available/sql deploy/freeradius/sql.conf
# The important lines are driver, dialect, the connection settings and read_clients.

sql {
	driver = "rlm_sql_mysql"
	dialect = "mysql"

	# Connection to the Laravel database. Use the user created by grants.sql.
	server = "127.0.0.1"
	port = 3306
	login = "radius"
	password = "CHANGE_ME"
	radius_db = "captiveportalapi"

	# Table names are the standard ones, created by the Laravel migration.
	acct_table1 = "radacct"
	acct_table2 = "radacct"
	postauth_table = "radpostauth"
	authcheck_table = "radcheck"
	groupcheck_table = "radgroupcheck"
	authreply_table = "radreply"
	groupreply_table = "radgroupreply"
	usergroup_table = "radusergroup"

	# Clean up sessions that never got a Stop record, for example after a router lost power.
	delete_stale_sessions = yes

	# Routers are not listed in the database: one shared client covers all of them, see clients.conf.
	read_clients = no

	read_groups = yes
	read_profiles = no

	sql_user_name = "%{User-Name}"

	pool {
		start = ${thread[pool].start_servers}
		min = ${thread[pool].min_spare_servers}
		max = ${thread[pool].max_servers}
		spare = ${thread[pool].max_spare_servers}
		uses = 0
		retry_delay = 30
		lifetime = 0
		idle_timeout = 60
	}

	group_attribute = "SQL-Group"

	$INCLUDE ${modconfdir}/${.:name}/main/${dialect}/queries.conf
}
