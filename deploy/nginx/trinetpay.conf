# /etc/nginx/sites-available/trinetpay.conf
#
# One server block for the main site and every ISP subdomain.
# The certificate must be a wildcard for wifikitaa.site and *.wifikitaa.site.

server {
    listen 80;
    listen [::]:80;
    server_name wifikitaa.site *.wifikitaa.site;

    # Routers download their setup script and login page over HTTPS, so send everything there.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wifikitaa.site *.wifikitaa.site;

    root /var/www/trinetpay/public;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/wifikitaa.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wifikitaa.site/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Logo uploads are the largest request.
    client_max_body_size 4m;

    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Never serve dotfiles such as .env or .git.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Router agent polls and setup downloads carry a secret token in the address.
    # Keep those out of the access log so the tokens are not written to disk.
    location ~ ^/(api/agent|provision)/ {
        access_log off;
        try_files $uri /index.php?$query_string;
    }
}
