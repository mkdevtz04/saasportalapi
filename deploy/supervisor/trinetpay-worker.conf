; /etc/supervisor/conf.d/trinetpay-worker.conf
;
; Keeps the queue worker running. It grants customers access after a payment and sends SMS receipts.
; If it stops, paid customers on routers connected by API do not get online, so watch it.

[program:trinetpay-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/trinetpay/artisan queue:work --sleep=1 --tries=3 --backoff=10 --max-time=3600
directory=/var/www/trinetpay
user=www-data
numprocs=2
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=3600
redirect_stderr=true
stdout_logfile=/var/www/trinetpay/storage/logs/worker.log
