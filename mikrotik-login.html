<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="pragma" content="no-cache">
<meta http-equiv="expires" content="-1">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WifiKitaa - WiFi Login</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:#eef3f7;font-family:Arial,Helvetica,sans-serif;color:#142033}
.page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:420px;background:#fff;border:1px solid #d8dee8;box-shadow:0 16px 48px rgba(20,32,51,.14)}
.header{padding:28px 28px 22px;border-bottom:2px solid #142033;display:flex;gap:14px;align-items:center}
.mark{width:48px;height:48px;background:#142033;color:#fff;display:grid;place-items:center;font-size:13px;font-weight:900;flex:0 0 auto}
.brand{font-size:22px;font-weight:900;line-height:1}
.sub{font-size:11px;font-weight:800;color:#526173;letter-spacing:.1em;text-transform:uppercase;margin-top:5px}
.body{padding:28px}
.error{padding:11px 13px;margin-bottom:18px;background:#fff1f1;border-left:4px solid #c62828;color:#a81717;font-size:13px;font-weight:700}
.error:empty,.error[data-error=""],.error[data-error^="$("]{ display:none}
label{display:block;font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:#344054;margin-bottom:7px}
input[name="username"]{width:100%;height:50px;padding:0 14px;font-size:17px;border:1.5px solid #b8c2d1;outline:none;background:#fbfdff;color:#142033}
input[name="username"]:focus{border-color:#0b7a75;box-shadow:0 0 0 3px rgba(11,122,117,.12)}
.btn{display:block;width:100%;height:50px;margin-top:14px;background:#142033;color:#fff;border:0;font-size:13px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.btn:hover{background:#0b7a75}
.divider{margin:22px 0;border:0;border-top:1px solid #e5e9f0}
.buy{display:block;text-align:center;padding:13px;background:#f0faf9;border:1.5px solid #0b7a75;color:#075954;font-size:13px;font-weight:900;text-decoration:none;letter-spacing:.04em;text-transform:uppercase}
.buy:hover{background:#0b7a75;color:#fff}
.footer{padding:14px 28px;background:#f7f9fb;border-top:1px solid #e5e9f0;font-size:11px;color:#667085;text-align:center}
</style>
</head>
<body>
<main class="page">
  <div class="card">
    <div class="header">
      <div class="mark">WK</div>
      <div>
        <div class="brand">WIFIKITAA</div>
        <div class="sub">WiFi Hotspot</div>
      </div>
    </div>

    <div class="body">
      <p class="error" data-error="$(error)">$(error)</p>

     <form name="login" action="$(link-login-only)" method="post">
  <input type="hidden" name="dst" value="$(link-orig)">
  <input type="hidden" name="popup" value="true">

  <label for="voucher">Voucher Code</label>
  <input id="voucher" name="username" type="text"
         placeholder="Enter your voucher code"
         autocomplete="one-time-code" required
         oninput="document.getElementsByName('password')[0].value = this.value">

  <input type="hidden" name="password" value="">

  <button class="btn" type="submit">Connect to WiFi</button>
</form>

      <hr class="divider">

      <a class="buy" href="https://wifikitaa.site/portal?mac=$(mac)&amp;ip=$(ip)&amp;link-login-only=$(link-login-only)&amp;link-orig=$(link-orig)&amp;nas=$(nas)">
        No voucher? &nbsp; Buy WiFi Now &rarr;
      </a>
    </div>

    <div class="footer">WifiKitaa &mdash; Fast &amp; Affordable WiFi</div>
  </div>
</main>
</body>
</html>
