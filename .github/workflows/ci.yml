name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, openssl, pdo_sqlite, sqlite3
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      # phpunit.xml carries its own APP_KEY, database and fake gateway settings,
      # so the suite never needs real credentials.
      - name: Run tests
        run: vendor/bin/phpunit

  # Advisory for now. About forty existing files do not follow the Laravel Pint
  # preset, so this cannot block merges until the repo gets a one-time reformat.
  # After that, delete continue-on-error to make style a required check.
  style:
    runs-on: ubuntu-latest
    continue-on-error: true
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - run: composer install --no-interaction --no-progress --prefer-dist

      - name: Check changed files only
        run: vendor/bin/pint --test --diff=origin/${{ github.base_ref }}
